<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Studio Incremental</title>

    <!-- Styles Modulaires -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/tree.css">
    <link rel="stylesheet" href="css/td.css">
    <link rel="stylesheet" href="css/rpg.css">
</head>
<body>
    <div class="game-layout">
        <header class="zone-a">
            <h1>Mon Studio</h1>
            <p>Développement de Jeux</p>
        </header>

        <nav class="zone-c">
            <button class="tab-btn active" onclick="openTab(event, 'tab-1')">Le Studio</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-2')">Équipement</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-3')">R&D (Arbre)</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-5')">Mini-Jeux</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-4')">Paramètres</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-6')">RPG</button>
        </nav>

        <aside class="zone-b" id="resource-container"></aside>

        <!-- Conteneur principal des onglets -->
        <main class="zone-d" id="main-container">
            <p style="text-align: center; color: #aaa; margin-top: 20px;">Chargement des modules...</p>
        </main>
    </div>

    <!-- 1. Données -->
    <script src="js/data/database.js"></script>
    
    <!-- 2. Interface (UI) -->
    <script src="js/ui/core.js"></script>
    <script src="js/ui/builders.js"></script>
    <script src="js/ui/tree.js"></script>
    
    <!-- 3. Moteur et Mini-jeux -->
    <script src="js/game/td.js"></script>
    <script src="js/game/rpg.js"></script>
    <script src="js/game/engine.js"></script>
</body>
</html>
